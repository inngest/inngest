ar-backoff, var(--warn))"/></pattern><pattern id="hx-stopped" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="sb sb-stopped" width="4" height="4" fill="var(--bar-stopped, var(--muted))"/><line class="sl sl-stopped" x1="1" y1="0" x2="1" y2="4" stroke="var(--bar-stopped, var(--muted))"/></pattern><pattern id="hx-waitstop" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="sb sb-waitstop" width="4" height="4" fill="var(--bar-waitstop, var(--muted))"/><line class="sl sl-waitstop" x1="1" y1="0" x2="1" y2="4" stroke="var(--bar-waitstop, var(--muted))"/></pattern><pattern id="hx-hold" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="sb sb-hold" width="4" height="4" fill="var(--bar-hold, var(--hold))"/><line class="sl sl-hold" x1="1" y1="0" x2="1" y2="4" stroke="var(--bar-hold, var(--hold))"/></pattern></defs><defs><filter id="ctxblur" x="-4%" y="-30%" width="108%" height="160%"><feGaussianBlur stdDeviation="0.62"/><feColorMatrix type="saturate" values="0.25"/></filter></defs><rect x="135.66" y="15" width="3.95" height="34" fill="var(--disc)" opacity="0.95"/><text x="2" y="17.5" font-family='JetBrains Mono, ui-monospace, monospace' font-size="7" fill="var(--muted)" opacity="1">req + a</text><rect x="64.00" y="11.5" width="25.78" height="7" rx="1" fill="url(#hx-idle)" opacity="1"/><rect x="89.78" y="11.5" width="47.86" height="7" rx="1" fill="url(#hx-disc)" opacity="1"/><rect x="137.63" y="11.5" width="27.61" height="7" rx="1" fill="url(#hx-idle)" opacity="1"/><rect x="165.25" y="11.5" width="202.50" height="7" rx="1" fill="url(#hx-good)" opacity="1"/><circle cx="64.00" cy="15" r="4.3" fill="var(--surface)" opacity="1"/><circle class="ev ev-queued" cx="64.00" cy="15" r="3" fill="var(--surface)" stroke="var(--ev-queued, var(--queued))" opacity="1"/><circle cx="89.77" cy="15" r="4.3" fill="var(--surface)" opacity="1"/><circle class="ev ev-hollow