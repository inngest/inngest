syntax = "proto3";
package api.v2;

import "google/protobuf/timestamp.proto";
option go_package = "github.com/inngest/inngest/proto/gen/api/v2;apiv2";

message Deploy {
  string id = 1;
  string name = 2;
  string tag = 3;
  string architecture = 4;
  // ready confirms artifact publication.  the post-deploy step runs after publication.
  string status = 5;
  string artifact_digest = 6;
  string error = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp finished_at = 10;
}

// runtime config such as ENV and CMD comes from the image archive.
message CreateDeployRequest {
  // use a workspace-local name so the deploy stays in the selected workspace.
  string name = 1;
  string tag = 2;
  string architecture = 3;
  int64 upload_size_bytes = 4;
  // use lowercase SHA256 of the uploaded archive bytes.  commit fails when the
  // uploaded bytes have a different hash.
  string upload_sha256 = 5;
  // config is required and contains the workload settings from the selected apps entry.
  DeployConfig config = 6;
}

message DeployConfig {
  optional string description = 1;
  DeploySpec spec = 2;
  // exactly one mode is required to select the app's workload type.
  oneof mode {
    DeployConnectConfig connect = 3;
    DeployServeConfig serve = 4;
  }
  // omitted settings use node defaults so the server can change them.
  // serve_config is valid only with serve.
  DeployServeRuntimeConfig serve_config = 5;
}

message DeploySpec {
  // memory is in MiB.  omission uses 2048 MiB.
  optional uint32 memory = 1;
  // cpu is in vCPUs.  omission uses 1 vCPU.
  optional uint32 cpu = 2;
}

message DeployConnectConfig {
  // omission uses one replica.  an explicit zero is invalid.
  optional uint32 replicas = 1;
}

message DeployServeConfig {
  // omission selects a port from the image's exposed ports at launch.
  optional uint32 port = 1;
  // omission uses /api/inngest inside the workload.
  optional string path = 2;
}

message DeployServeRuntimeConfig {
  optional uint32 multiplex = 1;
  optional uint32 max_requests = 2;
  // durations use Go syntax such as 15s and 15m.
  optional string idle = 3;
  optional string lifetime = 4;
}

message CreateDeployResponse {
  Deploy data = 1;
  // send the archive in a PUT request body with every header in
  // upload_headers.  set Content-Length to upload_size_bytes.  storage
  // rejects a request that changes a header or the length.
  string upload_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  // send each header with its exact value.  the server can add a header,
  // such as a checksum of the archive, without a client change.
  map<string, string> upload_headers = 4;
}
message CommitDeployRequest {
  string deploy_id = 1;
  // the name must match CreateDeployRequest so a commit cannot select another deploy.
  string name = 2;
}
message GetDeployRequest { string deploy_id = 1; }
message CancelDeployRequest { string deploy_id = 1; }
message DeployResponse { Deploy data = 1; }
message ListDeploysRequest {}
message ListDeploysResponse {
  // the response has at most 100 deploys to bound its size.
  repeated Deploy data = 1;
}
