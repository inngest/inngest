syntax = "proto3";
package queue.v1;

import "queue/v1/types.proto";

option go_package = "github.com/inngest/inngest/proto/gen/queue/v1;queue";

service ConsumerService {
  rpc Dequeue(DequeueRequest) returns (DequeueResponse) {}
  // A distinct RPC makes older proxies reject rather than ignore the condition.
  rpc DequeueWithLease(DequeueWithLeaseRequest) returns (DequeueWithLeaseResponse) {}
}

message DequeueRequest {
  string shard_name = 1;
  QueueItem item = 2;
  bool capacity_leased = 3;
  optional string expected_lease_id = 4;
}

message DequeueResponse {}

message DequeueWithLeaseRequest {
  // expected_lease_id must identify the caller's live lease.
  DequeueRequest request = 1;
}

message DequeueWithLeaseResponse {}
