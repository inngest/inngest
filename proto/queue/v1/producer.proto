syntax = "proto3";
package queue.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "queue/v1/types.proto";

option go_package = "github.com/inngest/inngest/proto/gen/queue/v1;queue";

service ProducerService {
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse) {}
  rpc Requeue(RequeueRequest) returns (RequeueResponse) {}
  rpc RequeueByJobID(RequeueByJobIDRequest) returns (RequeueByJobIDResponse) {}
}

message EnqueueRequest {
  Item item = 1;
  google.protobuf.Timestamp at = 2;
  EnqueueOptions opts = 3;
  // Return the finalized item only to callers observing durable enqueue.
  bool return_item = 4;
}

message EnqueueResponse {
  QueueItem item = 1;
  string shard_name = 2;
}

message RequeueRequest {
  string shard_name = 1;
  QueueItem item = 2;
  google.protobuf.Timestamp at = 3;
  bool capacity_leased = 4;
}

message RequeueResponse {}

message RequeueByJobIDRequest {
  string shard_name = 1;
  string job_id = 2;
  google.protobuf.Timestamp at = 3;
  Scope scope = 4;
}

message RequeueByJobIDResponse {}

message EnqueueOptions {
  bool passthrough_job_id = 1;
  string force_queue_shard_name = 2;
  string normalize_from_backlog_id = 3;
  optional google.protobuf.Duration idempotency_period = 4;
  string singleton_migration_key = 5;
  // Lease the item for the enqueuing caller in the enqueue commit (see
  // CallerLease). Queues that do not support it ignore it.
  CallerLease caller_lease = 6;
}

// CallerLease asks the queue to write the item already leased for the caller
// when it lands on one of shards, so the caller can run it without a separate
// lease. lease_id is the caller-chosen lease (a ULID whose time is the lease
// expiry), unique per enqueue call; a retry of the same call carries the same
// lease_id and gets the same lease back.
message CallerLease {
  repeated string shards = 1;
  string lease_id = 2;
  // at_limit: the caller takes over its run's concurrency slot for this item
  // (it holds the previous item's capacity lease), so the queue may lease it
  // while the function or key is at its limit, oldest run first.
  bool at_limit = 3;
}
