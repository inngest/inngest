syntax = "proto3";
package debug.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/inngest/inngest/proto/gen/debug/v1;debug";

// BatchInfoRequest is used to query the current batch for a function and batch key.
message BatchInfoRequest {
  // function_id is the UUID of the function.
  string function_id = 1;
  // batch_key is the optional batch key expression result. If empty, uses "default".
  string batch_key = 2;
}

// BatchInfoResponse contains information about the current batch.
message BatchInfoResponse {
  // batch_id is the current batch ULID if one exists.
  // Deprecated: use stores, which has the batch in each batch store.
  string batch_id = 1 [deprecated = true];
  // item_count is the number of events currently in the batch.
  // Deprecated: use stores, which has the batch in each batch store.
  int32 item_count = 2 [deprecated = true];
  // items contains the batch items with event data.
  // Deprecated: use stores, which has the batch in each batch store.
  repeated BatchEventItem items = 3 [deprecated = true];
  // status is the current batch status (pending, started, etc.).
  // Deprecated: use stores, which has the batch in each batch store.
  string status = 4 [deprecated = true];
  // stores has the current batch in each batch store. During a batch store
  // migration there is one entry per store; the fields above describe the
  // first store that holds items.
  repeated BatchStoreInfo stores = 5;
}

// BatchStoreInfo describes the current batch in one batch store.
message BatchStoreInfo {
  // store is the name of the batch store.
  string store = 1;
  // batch_id is the current batch ULID in this store, if one exists.
  string batch_id = 2;
  // item_count is the number of events in the batch.
  int32 item_count = 3;
  // items contains the batch items with event data.
  repeated BatchEventItem items = 4;
  // status is the batch status (pending, started, etc.).
  string status = 5;
}

// BatchEventItem represents a single event in a batch.
message BatchEventItem {
  string event_id = 1;
  string account_id = 2;
  string workspace_id = 3;
  string app_id = 4;
  string function_id = 5;
  int32 function_version = 6;
  // event_data is the JSON-encoded event payload.
  bytes event_data = 7;
}

// DeleteBatchRequest is used to delete a batch for a function and batch key.
message DeleteBatchRequest {
  // function_id is the UUID of the function.
  string function_id = 1;
  // batch_key is the optional batch key expression result. If empty, uses "default".
  string batch_key = 2;
}

// DeleteBatchResponse contains information about the deleted batch.
message DeleteBatchResponse {
  // deleted indicates whether a batch was found and deleted.
  // Deprecated: use stores, which has the result for each batch store.
  bool deleted = 1 [deprecated = true];
  // batch_id is the ULID of the deleted batch, if one was deleted.
  // Deprecated: use stores, which has the result for each batch store.
  string batch_id = 2 [deprecated = true];
  // item_count is the number of events that were in the deleted batch.
  // Deprecated: use stores, which has the result for each batch store.
  int32 item_count = 3 [deprecated = true];
  // stores has the result for each batch store. The fields above summarize
  // them: deleted is true if any store deleted a batch, batch_id is the first
  // deleted batch, and item_count is the total.
  repeated DeleteBatchStoreResult stores = 4;
}

// DeleteBatchStoreResult describes the batch deleted from one batch store.
message DeleteBatchStoreResult {
  // store is the name of the batch store.
  string store = 1;
  // deleted indicates whether a batch was found and deleted in this store.
  bool deleted = 2;
  // batch_id is the ULID of the deleted batch, if one was deleted.
  string batch_id = 3;
  // item_count is the number of events that were in the deleted batch.
  int32 item_count = 4;
}

// RunBatchRequest is used to trigger immediate execution of a batch.
message RunBatchRequest {
  // function_id is the UUID of the function.
  string function_id = 1;
  // batch_key is the optional batch key expression result. If empty, uses "default".
  string batch_key = 2;
}

// RunBatchResponse contains information about the scheduled batch execution.
message RunBatchResponse {
  // scheduled indicates whether a batch was found and scheduled.
  // Deprecated: use stores, which has the result for each batch store.
  bool scheduled = 1 [deprecated = true];
  // batch_id is the ULID of the batch that was scheduled.
  // Deprecated: use stores, which has the result for each batch store.
  string batch_id = 2 [deprecated = true];
  // item_count is the number of events in the batch.
  // Deprecated: use stores, which has the result for each batch store.
  int32 item_count = 3 [deprecated = true];
  // stores has the result for each batch store. The fields above summarize
  // them: scheduled is true if any store scheduled a batch, batch_id is the
  // first scheduled batch, and item_count is the total.
  repeated RunBatchStoreResult stores = 4;
}

// RunBatchStoreResult describes the batch scheduled in one batch store.
message RunBatchStoreResult {
  // store is the name of the batch store.
  string store = 1;
  // scheduled indicates whether a batch was found and scheduled in this store.
  bool scheduled = 2;
  // batch_id is the ULID of the scheduled batch.
  string batch_id = 3;
  // item_count is the number of events in the batch.
  int32 item_count = 4;
}
