syntax = "proto3";
package state.v2;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/inngest/inngest/proto/gen/state/v2;statev2";

message Metadata {
  ID              id      = 1;
  Config          config  = 2;
  RunMetrics      metrics = 3;
  repeated string stack   = 4;
}

message ID {
  string run_id      = 1;
  string function_id = 2;
  Tenant tenant      = 3;
}

message Config {
  // string                            function_slug    = 1; deprecated
  int64                             function_version = 2;
  string                            cron_schedule    = 3;
  string                            span_id          = 4;
  string                            batch_id         = 5;
  google.protobuf.Timestamp         started_at       = 6;
  repeated string                   event_ids        = 7;
  int64                             request_version  = 8;
  string                            idempotency      = 9;
  optional string                   replay_id        = 10;
  optional string                   original_run_id  = 11;
  optional int64                    priority_factor  = 12;
  repeated ConcurrencyKey           concurrency_keys = 13;
  bool                              force_step_plan  = 14;
  google.protobuf.Struct            context          = 15;
  bool                              has_ai           = 16;
  // semaphores_json stores semaphore constraints as a JSON-encoded string.
  // This avoids a proto schema change while ensuring semaphores survive
  // the state proxy round-trip.
  string                            semaphores_json  = 17;
  google.protobuf.Timestamp         scheduled_at     = 18;
}

message ConcurrencyKey {
  string key   = 1;
  string hash  = 2;
  int64  limit = 3;
}

message RunMetrics {
  int64 state_size = 1;
  int64 event_size = 2;
  int64 step_count = 3;
}

message Tenant {
  string app_id     = 1;
  string env_id     = 2;
  string account_id = 3;
}

message CreateStateRequest {
  Metadata metadata                  = 1;
  repeated bytes events              = 2;
  repeated bytes steps               = 3;
  repeated bytes steps_inputs        = 4;
}

message CreateStateResponse {
  Metadata           metadata = 1;
  repeated bytes     events   = 2;
  map<string, bytes> steps    = 3;
}

message DeleteStateRequest {
  ID id = 1;
}


message DeleteStateResponse {
  bool deleted = 1;
}

message LoadMetadataRequest {
  ID   id                          = 1;
  // Skip loading stack and step-derived metrics (state_size, step_count)
  // when the caller doesn't need them, avoiding an extra round trip.
  bool omit_stack_and_step_metrics = 2;
}

message LoadMetadataResponse {
  Metadata metadata = 1;
}

message UpdateMetadataRequest {
  ID                        id              = 1;
  google.protobuf.Timestamp started_at      = 2;
  int64                     request_version = 3;
  bool                      force_step_plan = 4;
}

message UpdateMetadataResponse{}

message SaveStepRequest {
  ID     id      = 1;
  string step_id = 2;
  bytes  data    = 3;
}

message SaveStepResponse{
  bool has_pending_steps = 1;
  // idempotent is set when the step already had exactly this output, so nothing new
  // was written.  Servers return this instead of an ErrIdempotentResponse error so
  // has_pending_steps survives.
  bool idempotent = 2;
}

message SavePendingRequest {
  ID id = 1;
  repeated string pending = 2;
}

message SavePendingResponse {}

message ExistsRequest {
  ID id = 1;
}

message ExistsResponse {
  bool exists = 1;
}

message LookupIdempotencyRequest {
  ID id = 1;
  string key = 2;
}

message IdempotencyEntry {
  string run_id = 1;
  bool is_tombstone = 2;
}

message LookupIdempotencyResponse {
  // An absent entry means no idempotency record exists.
  IdempotencyEntry entry = 1;
}

message LoadEventsRequest {
  ID id = 1;
}

message LoadEventsResponse {
  repeated bytes events = 4;
  bool cached = 5;
}


message LoadStepsRequest {
  ID id = 1;
}

message LoadStepsResponse {
  map<string, bytes> steps = 1;
}

message LoadStateRequest {
  ID id = 1;
}

message LoadStateResponse {
  Metadata           metadata = 1;
  repeated bytes     events   = 2;
  map<string, bytes> steps    = 3;
}

// DeferStatus mirrors enums.DeferStatus
enum DeferStatus {
  DEFER_STATUS_UNKNOWN   = 0;
  DEFER_STATUS_SCHEDULED = 1;
  DEFER_STATUS_AFTER_RUN = 2;
  DEFER_STATUS_ABORTED   = 3;
  DEFER_STATUS_REJECTED  = 4;
}

message Defer {
  string      fn_slug         = 1;
  string      hashed_id       = 2;
  DeferStatus schedule_status = 3;
  bytes       input           = 4;
  bytes       meta            = 5;
}

message DeferMeta {
  string      fn_slug         = 1;
  string      hashed_id       = 2;
  DeferStatus schedule_status = 3;
  bytes       meta            = 4;
}

message SaveDeferRequest {
  ID    id    = 1;
  Defer defer = 2;
}

message SaveDeferResponse {}

message SetDeferStatusRequest {
  ID          id        = 1;
  string      hashed_id = 2;
  DeferStatus status    = 3;
}

message SetDeferStatusResponse {}

message SaveRejectedDeferRequest {
  ID     id        = 1;
  string fn_slug   = 2;
  string hashed_id = 3;
}

message SaveRejectedDeferResponse {}

message LoadDefersRequest {
  ID id = 1;
}

message LoadDefersResponse {
  map<string, Defer> defers = 1;
}

message LoadDefersMetaRequest {
  ID id = 1;
}

message LoadDefersMetaResponse {
  map<string, DeferMeta> defers = 1;
}

message PauseIdentifier {
  string run_id      = 1;
  string function_id = 2;
  string account_id  = 3;
}

// Pause contains only the fields needed to consume a pause.
// Other metadata is ignored.
message Pause {
  string          id           = 1;
  string          workspace_id = 2;
  PauseIdentifier identifier   = 3;
  string          data_key     = 4;
}

message ConsumePauseOpts {
  reserved 1; // removed: idempotency_key
  bytes data = 2;
}

message ConsumePauseResult {
  bool did_consume       = 1;
  bool has_pending_steps = 2;
}

message ConsumePauseRequest {
  Pause            pause = 1;
  ConsumePauseOpts opts  = 2;
}

message ConsumePauseResponse {
  ConsumePauseResult result = 1;
}

enum InboxSaveOutcome {
  INBOX_SAVE_OUTCOME_UNSPECIFIED = 0;
  INBOX_SAVE_OUTCOME_SAVED       = 1;
  // The run already has as many steps as it is allowed. Nothing was saved.
  INBOX_SAVE_OUTCOME_STEPS_FULL  = 2;
  // The message would take the run's state past its size bound. Nothing was saved.
  INBOX_SAVE_OUTCOME_STATE_FULL  = 3;
}

message InboxMessage {
  string step_id        = 1;
  string inbox          = 2;
  bytes  value          = 3;
  int64  max_steps      = 4;
  int64  max_state_size = 5;
}

message InboxBatch {
  bool          drain  = 1;
  bool          unread = 2;
  optional int64 room  = 3;
}

message InboxWait {
  string               id                    = 1;
  string               inbox                 = 2;
  bytes                want                  = 3;
  string               seen                  = 4;
  bool                 timer                 = 5;
  InboxBatch           batch                 = 6;
  string               incoming              = 7;
  string               group_id              = 8;
  optional int64       max_attempts          = 9;
  int64                parallel_mode         = 10;
  string               parallel_coalesce_key = 11;
}

message InboxClose {
  string          step_id = 1;
  bytes           value   = 2;
  repeated string waits   = 3;
}

message InboxWake {
  InboxWait wait         = 1;
  string    message_step = 2;
  bool      timed_out    = 3;
  bool      closed       = 4;
  bool      has_pending  = 5;
}

message SaveInboxMessageRequest {
  ID           id      = 1;
  InboxMessage message = 2;
}

message SaveInboxMessageResponse {
  InboxSaveOutcome outcome = 1;
  repeated InboxWake wakes = 2;
}

message RecordInboxWaitRequest {
  ID        id   = 1;
  InboxWait wait = 2;
}

// wake is unset when no saved message satisfied the wait.
message RecordInboxWaitResponse {
  optional InboxWake wake = 1;
}

message TimeoutInboxWaitRequest {
  ID     id      = 1;
  string wait_id = 2;
  bytes  data    = 3;
}

// wake is unset when the wait was no longer recorded.
message TimeoutInboxWaitResponse {
  optional InboxWake wake = 1;
}

message CloseInboxRequest {
  ID         id      = 1;
  InboxClose closing = 2;
}

message CloseInboxResponse {
  repeated InboxWake wakes       = 1;
  bool               has_pending = 2;
}

message DeleteInboxWaitRequest {
  ID     id      = 1;
  string wait_id = 2;
}

message DeleteInboxWaitResponse {}

service RunService {
  rpc Create(CreateStateRequest) returns (CreateStateResponse) {}
  rpc Delete(DeleteStateRequest) returns (DeleteStateResponse) {}
  rpc Exists(ExistsRequest) returns (ExistsResponse) {}
  rpc LookupIdempotency(LookupIdempotencyRequest) returns (LookupIdempotencyResponse) {}
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse) {}
  rpc SaveStep(SaveStepRequest) returns (SaveStepResponse) {}
  rpc SavePending(SavePendingRequest) returns (SavePendingResponse) {}
  rpc ConsumePause(ConsumePauseRequest) returns (ConsumePauseResponse) {}

  rpc SaveDefer(SaveDeferRequest) returns (SaveDeferResponse) {}
  rpc SetDeferStatus(SetDeferStatusRequest) returns (SetDeferStatusResponse) {}
  rpc SaveRejectedDefer(SaveRejectedDeferRequest) returns (SaveRejectedDeferResponse) {}

  rpc SaveInboxMessage(SaveInboxMessageRequest) returns (SaveInboxMessageResponse) {}
  rpc RecordInboxWait(RecordInboxWaitRequest) returns (RecordInboxWaitResponse) {}
  rpc TimeoutInboxWait(TimeoutInboxWaitRequest) returns (TimeoutInboxWaitResponse) {}
  rpc CloseInbox(CloseInboxRequest) returns (CloseInboxResponse) {}
  rpc DeleteInboxWait(DeleteInboxWaitRequest) returns (DeleteInboxWaitResponse) {}

  rpc LoadMetadata(LoadMetadataRequest) returns (LoadMetadataResponse) {}
  rpc LoadEvents(LoadEventsRequest) returns (LoadEventsResponse) {}
  rpc LoadSteps(LoadStepsRequest) returns (LoadStepsResponse) {}
  rpc LoadState(LoadStateRequest) returns (LoadStateResponse) {}
  rpc LoadDefers(LoadDefersRequest) returns (LoadDefersResponse) {}
  rpc LoadDefersMeta(LoadDefersMetaRequest) returns (LoadDefersMetaResponse) {}
}
